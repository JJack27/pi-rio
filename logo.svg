<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" fill="none">
  <defs>
    <!-- Deep stealth cockpit background -->
    <radialGradient id="bg-grad" cx="56%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#132540"/>
      <stop offset="52%" stop-color="#0A1322"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>

    <!-- Subtle metallic bezel highlight -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Radar sweep phosphor wedge (seamless trailing fade) -->
    <linearGradient id="sweep-grad" x1="256" y1="95" x2="412" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="28%" stop-color="#2DD4BF" stop-opacity="0.04"/>
      <stop offset="72%" stop-color="#2DD4BF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.46"/>
    </linearGradient>

    <!-- Leading sweep beam -->
    <linearGradient id="beam-grad" x1="256" y1="256" x2="421" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Main reasoning trajectory gradient -->
    <linearGradient id="trail-grad" x1="146" y1="338" x2="348" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="48%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Soft phosphor glow for active path & target -->
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip inside radar scope -->
    <clipPath id="scope-clip">
      <circle cx="256" cy="256" r="176"/>
    </clipPath>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" stroke="url(#rim-grad)" stroke-width="3"/>

  <!-- Subtle cockpit corner HUD brackets -->
  <g stroke="#38BDF8" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round">
    <path d="M 62 94 L 62 62 L 94 62"/>
    <path d="M 418 62 L 450 62 L 450 94"/>
    <path d="M 62 418 L 62 450 L 94 450"/>
    <path d="M 418 450 L 450 450 L 450 418"/>
  </g>

  <!-- Radar Scope Interior (Clipped) -->
  <g clip-path="url(#scope-clip)">
    <!-- Subtle inner scope disc tint -->
    <circle cx="256" cy="256" r="176" fill="#06111D" fill-opacity="0.58"/>

    <!-- Radar Sweep Sector (-90° to -20°) -->
    <path d="M 256 256 L 256 80 A 176 176 0 0 1 421.4 195.8 Z" fill="url(#sweep-grad)"/>

    <!-- Radar Crosshair Axes (broken around center) -->
    <g stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5">
      <line x1="80" y1="256" x2="228" y2="256"/>
      <line x1="284" y1="256" x2="432" y2="256"/>
      <line x1="256" y1="80" x2="256" y2="228"/>
      <line x1="256" y1="284" x2="256" y2="432"/>
    </g>

    <!-- Concentric Range Rings -->
    <circle cx="256" cy="256" r="118" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.75"/>
    <circle cx="256" cy="256" r="60" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 6"/>

    <!-- Leading Radar Sweep Beam -->
    <line x1="256" y1="256" x2="421.4" y2="195.8" stroke="url(#beam-grad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Radar Origin Dot -->
    <circle cx="256" cy="256" r="4" fill="#38BDF8" fill-opacity="0.55"/>
  </g>

  <!-- Outer Scope Ring -->
  <circle cx="256" cy="256" r="176" stroke="#38BDF8" stroke-opacity="0.44" stroke-width="3"/>

  <!-- Compass Ticks Around Scope Perimeter -->
  <g stroke="#38BDF8" stroke-linecap="round">
    <!-- Major cardinal ticks -->
    <g stroke-opacity="0.7" stroke-width="3">
      <line x1="256" y1="68" x2="256" y2="86"/>
      <line x1="256" y1="426" x2="256" y2="444"/>
      <line x1="68" y1="256" x2="86" y2="256"/>
      <line x1="426" y1="256" x2="444" y2="256"/>
    </g>
    <!-- Diagonal ticks (45° intervals) -->
    <g stroke-opacity="0.34" stroke-width="2.2">
      <line x1="380.5" y1="131.5" x2="390.4" y2="121.6"/>
      <line x1="380.5" y1="380.5" x2="390.4" y2="390.4"/>
      <line x1="131.5" y1="380.5" x2="121.6" y2="390.4"/>
      <line x1="131.5" y1="131.5" x2="121.6" y2="121.6"/>
    </g>
  </g>

  <!-- Rejected Hypothesis / Pivot Dead-End Branch (Warm Amber) -->
  <g>
    <path
      d="M 234 281 L 294 316"
      stroke="#FB923C"
      stroke-opacity="0.9"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-dasharray="10 15"
    />
    <!-- Rejected Blip 'X' -->
    <g stroke="#FB923C" stroke-width="7" stroke-linecap="round">
      <line x1="308" y1="316" x2="328" y2="336"/>
      <line x1="328" y1="316" x2="308" y2="336"/>
    </g>
  </g>

  <!-- Active Agent Reasoning Trail (Explore -> Pivot -> Verify -> Locked Target) -->
  <g filter="url(#glow-soft)">
    <path
      d="M 146 338 L 218 272 L 268 196 L 344 164"
      stroke="url(#trail-grad)"
      stroke-width="11.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Trail Waypoint Nodes -->
  <!-- Start Node (Explore) -->
  <circle cx="146" cy="338" r="11.5" fill="#0A1525" stroke="#38BDF8" stroke-width="6.5"/>

  <!-- Pivot Node (Decision / Branch Point) -->
  <circle cx="218" cy="272" r="12.5" fill="#0A1525" stroke="#2DD4BF" stroke-width="6.5"/>

  <!-- Mid Node (Hypothesis Verified) -->
  <circle cx="268" cy="196" r="10.5" fill="#0A1525" stroke="#34D399" stroke-width="6.5"/>

  <!-- Locked Target Reticle (Current Active Intent) -->
  <g>
    <!-- Soft outer phosphor lock halo -->
    <circle cx="344" cy="164" r="30" fill="#34D399" fill-opacity="0.18" filter="url(#glow-strong)"/>
    <circle cx="344" cy="164" r="21" stroke="#6EE7B7" stroke-opacity="0.6" stroke-width="2.5"/>

    <!-- Fighter HUD Target Lock Corner Brackets -->
    <g stroke="#A7F3D0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 314 148 L 314 134 L 328 134"/>
      <path d="M 360 134 L 374 134 L 374 148"/>
      <path d="M 314 180 L 314 194 L 328 194"/>
      <path d="M 360 194 L 374 194 L 374 180"/>
    </g>

    <!-- Locked Target Core -->
    <circle cx="344" cy="164" r="10.5" fill="#ECFEFF" filter="url(#glow-soft)"/>
  </g>
</svg>
